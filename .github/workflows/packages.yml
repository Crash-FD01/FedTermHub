name: Pacchetti per le altre distribuzioni

# Costruisce i pacchetti «universali» (.deb per Debian/Ubuntu/Mint, .rpm per RHEL/Alma/Rocky e openSUSE,
# x86_64 e aarch64) e li installa su ogni distribuzione supportata, controllando che il programma parta
# e che il motore RDP, con la sua FreeRDP 3, si colleghi davvero a un server.
#
# Gira sulle pull request che toccano programma o pacchetti, e viene chiamato dal Rilascio (con
# test=false: i pacchetti di una versione sono già stati provati sulla sua pull request).
on:
  pull_request:
    paths:
      - 'fedtermhub/**'
      - 'native/**'
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/packages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      test:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Costruzione ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 9 ha la glibc più vecchia fra le distribuzioni supportate (2.34): quello che si compila
    # qui parte anche su tutte le altre.
    container: almalinux:9
    steps:
      # checkout prima di tutto il resto: serve lo script che riporta gli errori nelle annotazioni
      - name: Strumenti per il checkout
        run: dnf -y -q install tar gzip bash

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Strumenti di compilazione
        run: |
          .github/scripts/annotate.sh "dnf (${{ matrix.arch }})" sh -c '
            dnf -y install epel-release dnf-plugins-core &&
            dnf config-manager --set-enabled crb &&
            dnf -y install gcc make cmake ninja-build pkgconf-pkg-config openssl-devel zlib-devel krb5-devel \
              pulseaudio-libs-devel cups-devel pcsc-lite-devel fuse3-devel fuse3-libs rpm-build redhat-rpm-config \
              dpkg binutils findutils zstd diffutils which'

      - name: Versione di FreeRDP inclusa
        id: freerdp
        run: echo "version=$(sed -n 's/^FREERDP_VERSION="\${FREERDP_VERSION:-\([^}]*\)}"/\1/p' packaging/build-freerdp.sh)" >> "$GITHUB_OUTPUT"

      # La compilazione di FreeRDP prende qualche minuto: si rifà solo quando cambiano versione o opzioni.
      - uses: actions/cache@v5
        with:
          path: /opt/freerdp
          key: freerdp-${{ steps.freerdp.outputs.version }}-${{ matrix.arch }}-alma9-${{ hashFiles('packaging/build-freerdp.sh') }}

      - name: Pacchetti
        run: |
          [ -f /opt/freerdp/lib/pkgconfig/freerdp3.pc ] || \
            .github/scripts/annotate.sh "FreeRDP (${{ matrix.arch }})" packaging/build-freerdp.sh /opt/freerdp
          # Il pacchetto principale è uguale per tutte le architetture: si costruisce una volta.
          export FREERDP_PREFIX=/opt/freerdp
          if [ "${{ matrix.arch }}" != x86_64 ]; then export SKIP_MAIN=1; fi
          .github/scripts/annotate.sh "Pacchetti (${{ matrix.arch }})" packaging/build-packages.sh ${{ matrix.arch }}
          ls -l dist/packages

      - uses: actions/upload-artifact@v7
        with:
          name: universali-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 7

  # Un sito di prova come quello pubblicato (repository APT e RPM firmati, setup.sh), con una chiave
  # usa e getta: le prove installano da qui con setup.sh, esattamente come un utente. Così un problema
  # dei repository (per esempio zypper che non trova i pacchetti) si vede prima del rilascio.
  site:
    name: Sito di prova
    needs: build
    if: ${{ !inputs.ref || inputs.test }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: universali-*
          path: pkgs
          merge-multiple: true
      - name: Repository e sito con una chiave di prova
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm createrepo-c apt-utils dpkg-dev > /dev/null
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "FedTermHub CI <ci@example.invalid>" rsa3072 sign 1d
          export GPG_KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          ALLOW_MISSING=1 .github/scripts/annotate.sh "Repository di prova" \
            packaging/update-repo.sh pkgs out https://example.invalid/release http://localhost:8080
          .github/scripts/annotate.sh "Sito di prova" \
            packaging/render-site.sh out/site http://localhost:8080 "https://github.com/$GITHUB_REPOSITORY" test
          find out/site -maxdepth 2 | sort
      - uses: actions/upload-artifact@v7
        with:
          name: sito-prova
          path: out/site
          include-hidden-files: true
          retention-days: 3

  test:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    needs: site
    # Chiamato dal Rilascio (che passa sempre «ref») si fa solo con test=true; sulle pull request e a
    # mano «inputs» è vuoto e le prove si fanno sempre.
    if: ${{ !inputs.ref || inputs.test }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:12', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'debian:13', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'ubuntu:22.04', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'ubuntu:24.04', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'almalinux:9', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'almalinux:10', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'rockylinux/rockylinux:9', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'opensuse/tumbleweed', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'opensuse/leap:16.0', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'ubuntu:24.04', arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: 'debian:12', arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: 'almalinux:9', arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      # checkout ha bisogno di tar (e openSUSE e le immagini minime non sempre lo hanno)
      - name: Preparazione del container
        run: |
          if command -v apt-get > /dev/null; then apt-get update -q && apt-get install -y -q tar gzip bash python3 > /dev/null
          elif command -v zypper > /dev/null; then zypper --non-interactive -q install tar gzip bash gawk python3
          elif command -v dnf > /dev/null; then dnf -y -q install tar gzip bash findutils python3
          fi
        shell: sh

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: sito-prova
          path: /srv/sito

      - name: Installazione con setup.sh dal sito di prova, e prove
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory /srv/sito > /tmp/http.log 2>&1 &
          for _ in $(seq 1 20); do (exec 3<> /dev/tcp/127.0.0.1/8080) 2> /dev/null && break; sleep 0.25; done
          packaging/ci-install-test.sh --site http://localhost:8080 --source-tests
