name: Verifica installazione

# Installa FedTermHub come lo installa un utente: dal sito pubblicato, con il comando del README, su
# ogni distribuzione supportata appena installata. Controlla che apt, dnf e zypper accettino firme e
# metadati, che arrivi l'ultima versione rilasciata, che il programma si avvii davvero, che il motore
# RDP si colleghi a un server e che --remove lasci il sistema pulito.
# La CI prova i sorgenti, questo prova quello che arriva agli utenti: gira dopo ogni rilascio e ogni
# lunedì, così un sito o un repository rotto si scopre prima che lo segnali qualcuno.
on:
  workflow_run:
    workflows: [Rilascio, Pubblicazione automatica]
    types: [completed]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/install-check.yml, packaging/ci-install-test.sh]

permissions:
  contents: read

jobs:
  latest:
    name: Ultima versione rilasciata
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      site: ${{ steps.release.outputs.site }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: release
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | sed 's/^v//')
          test -n "$latest" || { echo "::error title=Release::nessuna release pubblicata"; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "site=https://$owner.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "ultima release: $latest"

  install:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    needs: latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'fedora:43', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'fedora:44', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'debian:12', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'debian:13', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'ubuntu:22.04', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'ubuntu:24.04', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'almalinux:9', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'almalinux:10', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'opensuse/tumbleweed', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'opensuse/leap:16.0', arch: x86_64, runner: ubuntu-24.04 }
          - { image: 'fedora:44', arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: 'ubuntu:24.04', arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: 'almalinux:9', arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Preparazione del container
        shell: sh
        run: |
          if command -v apt-get > /dev/null; then apt-get update -q && apt-get install -y -q tar gzip bash > /dev/null
          elif command -v zypper > /dev/null; then zypper --non-interactive -q install tar gzip bash gawk
          elif command -v dnf > /dev/null; then dnf -y -q install tar gzip bash findutils
          fi

      # Dal repository servono solo lo script delle prove e la sonda del motore RDP.
      - uses: actions/checkout@v7

      - name: Installazione con il comando del README e prove
        shell: bash
        run: packaging/ci-install-test.sh --site "${{ needs.latest.outputs.site }}" --version "${{ needs.latest.outputs.version }}"
