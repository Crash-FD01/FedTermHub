name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Controlli che non richiedono GTK: girano in pochi secondi su un runner
  # normale e intercettano la maggior parte degli errori.
  lint:
    name: Sintassi e coerenza interfaccia
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compilazione di tutti i moduli
        run: python -m compileall -q fedtermhub tests

      - name: Sintassi degli script di shell
        run: bash -n install.sh uninstall.sh COMPILA-RPM.sh

      - name: Parità dei temi, contrasti, mnemonici, tooltip
        run: python tests/test_theme_parity.py

      - name: Analisi statica
        run: |
          pipx install ruff
          # Solo le regole che segnalano errori veri: lo stile verrà dopo,
          # quando il monolite sarà stato spezzato.
          ruff check --select=E9,F63,F7,F82 fedtermhub tests

  # Conformità REUSE: ogni file deve dichiarare autore e licenza.
  reuse:
    name: Licenze (REUSE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  # Build RPM reale in un container Fedora: è l'unico modo di verificare che
  # lo spec stia in piedi, che il binario C compili con gli hardening flag
  # della distribuzione e che i test con GTK passino sotto Xvfb.
  rpm:
    name: Build RPM su Fedora
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/checkout@v5

      - name: Dipendenze di build
        run: |
          dnf -y install rpm-build rpmdevtools rpmlint dnf-plugins-core tar gzip git
          dnf -y builddep fedtermhub.spec

      - name: Preparazione del tarball
        run: |
          VERSION=$(rpmspec -q --qf '%{version}\n' fedtermhub.spec | head -1)
          mkdir -p ~/rpmbuild/SOURCES
          # Il tarball deve avere il prefisso di cartella che %autosetup si
          # aspetta, cioè nome-versione.
          git config --global --add safe.directory "$PWD"
          tar --exclude-vcs --transform "s,^\.,fedtermhub-${VERSION}," \
              -czf ~/rpmbuild/SOURCES/fedtermhub-${VERSION}.tar.gz .

      - name: Build del pacchetto
        run: |
          set -o pipefail
          rpmbuild -ba fedtermhub.spec 2>&1 | tee /tmp/rpmbuild.log
          echo "esito rpmbuild: $?"

      - name: Riepilogo dell'errore di build
        # In caso di fallimento porta le righe utili del log nelle annotazioni
        # della PR: si leggono subito, senza scaricare i log completi.
        if: failure()
        run: |
          test -f /tmp/rpmbuild.log || exit 0
          # Righe che segnalano un errore, con il loro numero
          grep -nE 'error|Error|ERROR|FAILED|Traceback|AssertionError|No such file|not found|Bad exit status|E: ' /tmp/rpmbuild.log \
            | tail -25 > /tmp/errori.txt || true
          # Ultime righe del log: il contesto immediato del fallimento
          tail -40 /tmp/rpmbuild.log > /tmp/coda.txt
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' "$1" | awk 'BEGIN{ORS="%0A"} {print}'; }
          echo "::error title=rpmbuild - righe di errore::$(enc /tmp/errori.txt)"
          echo "::error title=rpmbuild - ultime 40 righe::$(enc /tmp/coda.txt)"

      - name: Controlli rpmlint
        # Informativo: rpmlint segnala anche convenzioni opinabili. Serve a
        # vedere la lista crescere o calare, non a bloccare la build.
        run: rpmlint ~/rpmbuild/RPMS/*/*.rpm || true

      - name: Verifica degli hardening flag nel binario nativo
        run: |
          dnf -y install binutils
          BIN=$(find ~/rpmbuild/BUILD -name fedtermrdp-native -type f | head -1)
          echo "Binario: $BIN"
          # -z now produce la sezione .dynamic con BIND_NOW: se manca, i flag
          # della distribuzione non sono arrivati al compilatore.
          readelf -d "$BIN" | grep -q 'BIND_NOW' \
            && echo "OK: BIND_NOW presente" \
            || { echo "ERRORE: il binario non ha BIND_NOW, %set_build_flags non ha avuto effetto"; exit 1; }

      - name: Pubblica gli RPM come artefatto
        uses: actions/upload-artifact@v5
        with:
          name: rpm-fedora41
          path: ~/rpmbuild/RPMS/*/*.rpm
          if-no-files-found: error
