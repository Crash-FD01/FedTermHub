# Licenze dei file che non possono contenere un'intestazione (immagini, dati,
# documentazione) e del codice di terzi.
# Formato REUSE (https://reuse.software): `reuse lint` verifica che ogni file
# del repository abbia autore e licenza dichiarati.
version = 1
SPDX-PackageName = "FedTermHub"
SPDX-PackageSupplier = "Crash"
SPDX-PackageDownloadLocation = "https://github.com/Crash-FD01/FedTermHub"

# Tutto ciò che è di FedTermHub e non ha un'intestazione propria: icone,
# documentazione, metadati, configurazione, file di packaging, dati dei test.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Crash"
SPDX-License-Identifier = "GPL-3.0-or-later"

# I metadati AppStream sono CC0: lo richiedono Flathub e i software center,
# che li riusano per generare i cataloghi.
[[annotations]]
path = "packaging/io.github.crash_fd01.fedtermhub.metainfo.xml"
precedence = "override"
SPDX-FileCopyrightText = "2026 Crash"
SPDX-License-Identifier = "CC0-1.0"

# Testi delle licenze: si riportano verbatim e non ricevono un'intestazione.
[[annotations]]
path = "LICENSES/**"
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# xterm.js e il suo addon fit: terminale dell'interfaccia Qt (MIT), ripresi da Helpix
[[annotations]]
path = ["fedtermhub/qtui/xterm/xterm.js", "fedtermhub/qtui/xterm/xterm.css", "fedtermhub/qtui/xterm/addon-fit.js",
        "fedtermhub/qtui/xterm/LICENSE-xterm.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2017-2019 The xterm.js authors (https://github.com/xtermjs/xterm.js)",
                          "2014-2016 SourceLair Private Company (https://www.sourcelair.com)",
                          "2012-2013 Christopher Jeffrey (https://github.com/chjj/)"]
SPDX-License-Identifier = "MIT"

# noVNC 1.7.0 (client VNC dell'interfaccia Qt, MPL-2.0) riunito in un modulo con esbuild; contiene pako
# (MIT, con parti zlib sotto licenza Zlib). La pagina vnc.html è di FedTermHub.
[[annotations]]
path = ["fedtermhub/qtui/novnc/novnc.mjs", "fedtermhub/qtui/novnc/LICENSE-noVNC.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2022 The noVNC authors (https://github.com/novnc/noVNC)",
                          "2014-2016 Vitaly Puzrin and Andrei Tuputcyn (pako)"]
SPDX-License-Identifier = "MPL-2.0 AND MIT AND Zlib"

[[annotations]]
path = "fedtermhub/qtui/novnc/LICENSE-pako.txt"
precedence = "override"
SPDX-FileCopyrightText = "2014-2016 Vitaly Puzrin and Andrei Tuputcyn"
SPDX-License-Identifier = "MIT"
